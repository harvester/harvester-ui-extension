name: Build Standalone on PR Merge

on:
  push:
    branches:
      - main
      - 'release-harvester-v*'
      - '*-dev'
  pull_request:
    branches:
      - main
      - 'release-harvester-v*'
      - '*-dev'
    types:
      - merged
      - labeled

jobs:
  build-validation:
    name: Build Test
    # allow triggering when a PR is labeled with "build-artifact"
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'build-artifact'
    uses: ./.github/workflows/run-lint.yaml
  build:
    name: Build and Upload Package
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'build-artifact'
    uses: ./.github/workflows/build-and-publish-standalone.yaml
    needs:
      - build-validation
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      # For PR-triggered runs github.ref_name is "<prNumber>/merge" (not a real
      # branch), which breaks the upload gate. Only pass a branch for push
      # events (github.ref_name is truthy there); PRs get '' so the gate skips.
      # Note: the A && B || C ternary requires B to be truthy, so the push
      # branch must be on the && side (an empty string on the && side would
      # always fall through to C).
      CI_BRANCH: ${{ github.event_name == 'push' && github.ref_name || '' }}
